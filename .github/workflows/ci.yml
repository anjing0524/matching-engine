name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Commit messages
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
          scripts/check-commit-messages.sh "origin/${{ github.event.pull_request.base.ref }}..HEAD"

      - name: Docs consistency
        run: scripts/check-docs.sh

      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Build trading binaries
        run: cargo build --release --bins

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f deploy/Dockerfile -t trading-engine:ci .
      - name: Smoke run
        run: |
          docker run --rm trading-engine:ci \
            --iterations 3 \
            --listen 127.0.0.1:0 \
            --metrics-listen 127.0.0.1:0
