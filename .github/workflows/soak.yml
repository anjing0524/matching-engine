name: Soak

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TRADING_SOAK_SECS: "120"
      TRADING_LOAD_CLIENTS: "32"
      TRADING_LOAD_ORDERS: "2000"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Run soak suite
        run: ./scripts/run-soak.sh
